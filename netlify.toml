# Site statique : rien a construire, la racine du depot est publiee telle quelle.
[build]
  publish = "."
  command = ""

# Le JSON des spots ne bouge qu'apres une passe d'enrichissement, mais quand il
# bouge c'est pour ajouter des spots : les garder une heure en cache donne un
# site qui ment. Revalidation a chaque chargement, l'ETag rend le 304 gratuit.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le code du site, lui, doit pouvoir etre repousse sans attendre un cache.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
